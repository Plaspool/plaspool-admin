<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- This maps the admin surface as well as the public one. It is deployed for
     the team's convenience, not for search engines; vercel.json sends the
     matching X-Robots-Tag, and this covers the file when served from anywhere
     that does not. -->
<meta name="robots" content="noindex, nofollow">
<title>API Reference — Shop, Blog &amp; Public</title>
<style>
  :root{
    --bg:#faf8f2; --panel:#fffefb; --raised:#f3efe4; --inset:#eae5d6;
    --ink:#1c1b16; --ink-2:#3b3931; --ink-3:#5d594d; --ink-4:#7c7768;
    --rule:#ddd7c6; --rule-strong:#c5bda6;
    --accent:#9a5b2c; --accent-soft:#f0e3d5; --accent-ink:#fff;
    --get:#2d6b4f; --post:#1f5a91; --patch:#8a6511; --put:#6b4a99; --del:#9c2f2f;
    /* OPTIONS is deliberately the quietest of the six: the only method here that
       names a preflight rather than an operation somebody performs. */
    --opt:#5a6b73;
    --ok:#2d6b4f; --warn:#8a6511; --err:#9c2f2f;
    --code-bg:#f3efe4;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono",Menlo,Consolas,monospace;
    --sans:"Inter var",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --sidebar:280px;
  }
  :root[data-theme="dark"]{
    --bg:#14140f; --panel:#1c1c16; --raised:#24241c; --inset:#111109;
    --ink:#f4f1e6; --ink-2:#ded9c8; --ink-3:#b3ad99; --ink-4:#8e8877;
    --rule:#33322a; --rule-strong:#4a483c;
    --accent:#d98f52; --accent-soft:#3a2a1c; --accent-ink:#14140f;
    --get:#6fc296; --post:#6fa8dc; --patch:#d9b45c; --put:#b092d9; --del:#e08585;
    --opt:#9fb4bd;
    --ok:#6fc296; --warn:#d9b45c; --err:#e08585;
    --code-bg:#111109;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent)}
  code{font-family:var(--mono); font-size:.86em; background:var(--code-bg);
       padding:.1em .35em; border-radius:4px; border:1px solid var(--rule)}
  pre{margin:0}
  pre code{background:none;border:none;padding:0;font-size:12.5px;line-height:1.65}
  button{font:inherit;cursor:pointer}

  /* ── layout ─────────────────────────────────────────────── */
  /* `min-width:0` on both tracks is load-bearing, not tidying: a grid item
     defaults to `min-width:auto`, so a single wide <pre> would push the whole
     page sideways instead of scrolling inside its own box. */
  .shell{display:grid; grid-template-columns:var(--sidebar) minmax(0,1fr); min-height:100vh}
  .shell > *{min-width:0}

  aside{
    position:sticky; top:0; height:100vh; overflow-y:auto;
    background:var(--panel); border-right:1px solid var(--rule);
    padding:20px 0 60px;
  }
  .brand{padding:0 20px 14px; border-bottom:1px solid var(--rule); margin-bottom:14px}
  .brand h1{font-size:15px;margin:0 0 2px;letter-spacing:-.01em}
  .brand p{margin:0;font-size:12px;color:var(--ink-4)}

  .surface-switch{display:flex;gap:4px;padding:0 16px 14px}
  .surface-switch button{
    flex:1; padding:7px 10px; border-radius:7px; font-size:12.5px; font-weight:600;
    border:1px solid var(--rule); background:transparent; color:var(--ink-3);
    transition:background .12s,color .12s,border-color .12s;
  }
  .surface-switch button[aria-pressed="true"]{
    background:var(--accent); border-color:var(--accent); color:var(--accent-ink);
  }

  .searchwrap{padding:0 16px 12px;position:relative}
  #search{
    width:100%; padding:8px 10px 8px 30px; border-radius:7px; font-size:13px;
    border:1px solid var(--rule-strong); background:var(--inset); color:var(--ink);
  }
  #search:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .searchwrap svg{position:absolute;left:25px;top:9px;width:14px;height:14px;
                  fill:none;stroke:var(--ink-4);stroke-width:2}
  .searchwrap kbd{position:absolute;right:25px;top:8px;font-family:var(--mono);
                  font-size:10px;color:var(--ink-4);background:var(--raised);
                  border:1px solid var(--rule);border-radius:4px;padding:1px 5px}

  nav h3{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
    color:var(--ink-4); margin:18px 20px 6px; font-weight:700;
  }
  nav a{
    display:flex; align-items:baseline; gap:8px; padding:4px 20px;
    text-decoration:none; color:var(--ink-3); font-size:13px; border-left:2px solid transparent;
  }
  nav a:hover{background:var(--raised); color:var(--ink)}
  nav a.active{border-left-color:var(--accent); background:var(--accent-soft); color:var(--ink)}
  nav a .vb{font-family:var(--mono);font-size:9.5px;font-weight:700;min-width:38px;
            letter-spacing:.03em;flex:0 0 auto}
  nav a .np{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);
            font-size:11.5px}

  main{padding:34px 40px 120px; max-width:1000px}

  /* ── method + auth chips ────────────────────────────────── */
  .vb.GET{color:var(--get)} .vb.POST{color:var(--post)} .vb.PATCH{color:var(--patch)}
  .vb.PUT{color:var(--put)} .vb.DELETE{color:var(--del)} .vb.OPTIONS{color:var(--opt)}
  .m-chip{
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.04em;
    padding:3px 8px; border-radius:5px; border:1px solid currentColor; flex:0 0 auto;
  }
  .m-chip.GET{color:var(--get)} .m-chip.POST{color:var(--post)}
  .m-chip.PATCH{color:var(--patch)} .m-chip.PUT{color:var(--put)}
  .m-chip.DELETE{color:var(--del)} .m-chip.OPTIONS{color:var(--opt)}

  .auth{
    font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px;
    border:1px solid var(--rule-strong); color:var(--ink-3); background:var(--raised);
    white-space:nowrap;
  }
  .auth.public{color:var(--ok);border-color:currentColor}
  .auth.owner{color:var(--err);border-color:currentColor}
  .auth.webhook,.auth.cron{color:var(--warn);border-color:currentColor}

  /* ── route card ─────────────────────────────────────────── */
  .route{
    border:1px solid var(--rule); border-radius:10px; background:var(--panel);
    margin-bottom:12px; overflow:hidden; scroll-margin-top:20px;
  }
  .route.open{border-color:var(--rule-strong)}
  .route > summary{
    list-style:none; cursor:pointer; padding:13px 16px;
    display:flex; align-items:center; gap:11px; flex-wrap:wrap;
  }
  .route > summary::-webkit-details-marker{display:none}
  .route > summary:hover{background:var(--raised)}
  .route summary .path{font-family:var(--mono);font-size:13.5px;color:var(--ink);
                       font-weight:600;word-break:break-all}
  .route summary .sum{color:var(--ink-4);font-size:13px;flex:1 1 220px;min-width:0}
  .body{padding:4px 16px 18px;border-top:1px solid var(--rule)}

  h2{font-size:24px;margin:44px 0 6px;letter-spacing:-.02em;scroll-margin-top:20px}
  h2:first-of-type{margin-top:0}
  h3.grp{font-size:13px;text-transform:uppercase;letter-spacing:.08em;
         color:var(--ink-4);margin:30px 0 10px;font-weight:700;scroll-margin-top:20px}
  h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;
     color:var(--ink-4);margin:18px 0 7px;font-weight:700}

  .desc{color:var(--ink-2);font-size:14px;margin:12px 0 0}
  .desc strong{color:var(--ink)}

  table{border-collapse:collapse;width:100%;font-size:13px;margin:2px 0}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
     color:var(--ink-4);padding:5px 10px 5px 0;border-bottom:1px solid var(--rule);font-weight:700}
  td{padding:7px 10px 7px 0;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
  td:first-child{font-family:var(--mono);font-size:12px;color:var(--ink);white-space:nowrap}
  tr:last-child td{border-bottom:none}
  .st{font-family:var(--mono);font-weight:700}
  .st.s2{color:var(--ok)} .st.s3{color:var(--put)} .st.s4{color:var(--warn)} .st.s5{color:var(--err)}

  .codeblock{
    background:var(--code-bg); border:1px solid var(--rule); border-radius:8px;
    padding:12px 14px; overflow-x:auto; margin:6px 0 0;
  }
  .codeblock code{color:var(--ink-2)}

  .note{
    border-left:3px solid var(--accent); background:var(--accent-soft);
    padding:10px 14px; border-radius:0 8px 8px 0; margin:14px 0; font-size:13.5px; color:var(--ink-2);
  }
  .note.warn{border-left-color:var(--warn)}
  .note strong{color:var(--ink)}
  .src{font-family:var(--mono);font-size:11px;color:var(--ink-4);margin-top:16px}

  /* ── try it ─────────────────────────────────────────────── */
  .try{border:1px solid var(--rule); border-radius:8px; background:var(--raised);
       padding:12px 14px; margin-top:16px}
  .try-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .try-head strong{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-4)}
  .try-row{display:flex;gap:8px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
  .try-row label{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);min-width:104px}
  .try input,.try textarea{
    flex:1 1 200px; padding:6px 9px; border-radius:6px; font-family:var(--mono); font-size:12px;
    border:1px solid var(--rule-strong); background:var(--panel); color:var(--ink);
  }
  .try textarea{width:100%;min-height:96px;resize:vertical;flex-basis:100%}
  .try input:focus,.try textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  .btn{
    padding:7px 15px;border-radius:7px;font-size:12.5px;font-weight:600;
    border:1px solid var(--rule-strong); background:var(--panel); color:var(--ink-2);
  }
  .btn:hover{border-color:var(--accent);color:var(--ink)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.pri:hover{filter:brightness(1.08)}
  .out{margin-top:10px;display:none}
  .out.show{display:block}
  .out-status{font-family:var(--mono);font-size:12px;font-weight:700;margin-bottom:6px}

  .topbar{display:flex;justify-content:space-between;align-items:center;
          gap:14px;margin-bottom:26px;flex-wrap:wrap}
  .base{display:flex;align-items:center;gap:8px}
  .base label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-4);font-weight:700}
  .base input{padding:6px 10px;border-radius:7px;font-family:var(--mono);font-size:12px;
              border:1px solid var(--rule-strong);background:var(--panel);color:var(--ink);width:230px}
  .lede{color:var(--ink-3);font-size:15px;max-width:70ch;margin:8px 0 0}
  .count{font-size:12px;color:var(--ink-4);margin:20px 0 0}
  .empty{color:var(--ink-4);padding:40px 0;text-align:center;font-size:14px}

  .toc-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:20px 0 0}
  .toc-cards a{
    display:block;padding:12px 14px;border:1px solid var(--rule);border-radius:9px;
    background:var(--panel);text-decoration:none;color:var(--ink);
  }
  .toc-cards a:hover{border-color:var(--accent)}
  .toc-cards a b{display:block;font-size:13.5px;margin-bottom:2px}
  .toc-cards a span{font-size:12px;color:var(--ink-4)}

  @media (max-width:900px){
    .shell{grid-template-columns:1fr}
    aside{position:static;height:auto;border-right:none;border-bottom:1px solid var(--rule)}
    main{padding:24px 18px 90px}
  }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">
      <h1>API Reference</h1>
      <p>Shop · Blog · Public — Hono on Vercel</p>
    </div>
    <div class="surface-switch" id="switch"></div>
    <div class="searchwrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Filter routes…" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <nav id="nav"></nav>
  </aside>

  <main>
    <div class="topbar">
      <div class="base">
        <label for="baseurl">Base URL</label>
        <input id="baseurl" value="" placeholder="(same origin)" spellcheck="false"
               title="Leave empty to call this page's own origin — that is same-origin, so no CORS is involved. The Vite dev server proxies /api to the API on port 8787.">
      </div>
      <button class="btn" id="theme">Light theme</button>
    </div>
    <div id="content"></div>
  </main>
</div>

<script src="routes.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  };

  var AUTH = {
    public:   ['Public',            'No credential at all. Anyone on the internet may call this.'],
    session:  ['Writer session',    'Needs the <code>__Host-studio_session</code> cookie — any writer or the owner.'],
    owner:    ['Owner only',        'Needs a writer session whose role is <code>owner</code>. A writer gets 403.'],
    customer: ['Customer session',  'Needs the <code>__Host-shop_session</code> cookie from a redeemed magic link.'],
    guest:    ['Customer or token', 'A customer session, or a signed guest token in <code>?token=</code>.'],
    webhook:  ['HMAC signature',    'No cookie. Authority is an HMAC over the raw request body.'],
    cron:     ['Cron secret',       'Needs <code>Authorization: Bearer &lt;CRON_SECRET&gt;</code>. Fails closed.']
  };

  var CART_VIEW = '{\n' +
    '  "cart": {\n' +
    '    "id": "…", "currency": "GBP",\n' +
    '    "status": "open" | "converting" | "converted" | "abandoned",\n' +
    '    "revision": 4, "expiresAt": 0,\n' +
    '    "email": "…" | null,\n' +
    '    "shippingOptionId": "…" | null,\n' +
    '    "taxZone": "…" | null,\n' +
    '    "customerId": "…" | null\n' +
    '  },\n' +
    '  "lines": [ {\n' +
    '    "id": "…", "variantId": "…", "qty": 2,\n' +
    '    "available": true, "inStock": 12,\n' +
    '    "sku": "…" | null, "title": "…" | null,\n' +
    '    "optionValues": { "size": "M" } | null,\n' +
    '    "unit": { "amount": 1999, "currency": "GBP" } | null\n' +
    '  } ],\n' +
    '  "preview": { … frozen totals … } | null,   // null if ANY line is unpriceable\n' +
    '  "changes": []                              // merge results, normally empty\n' +
    '}';

  var routeId = function (r) {
    return (r.m + r.p).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  };

  /* ── concept pages, one per surface ─────────────────────── */

  var COMMON_ERRORS =
    '<h4>The error envelope</h4>' +
    '<p class="desc">Every error body carries a <code>requestId</code> matching the <code>x-request-id</code> response header. ' +
    'It is minted server-side and never echoed from the request, so it is safe to quote in a bug report — it is the only thread between what you saw and what the log holds. ' +
    'A 500 never carries a message or a stack.</p>' +
    '<div class="codeblock"><pre><code>{ "error": "bad_request", "detail": "email", "requestId": "8f3c…" }</code></pre></div>' +
    '<table><thead><tr><th>Status</th><th>error</th><th>Means</th></tr></thead><tbody>' +
    row('400', 'bad_request', 'Malformed request. <code>detail</code> names the offending field — never its value.') +
    row('401', 'unauthenticated', 'No session, or it expired.') +
    row('403', 'forbidden', 'Authenticated but not allowed — or a missing/unrecognised <code>Origin</code> on an unsafe method.') +
    row('404', 'gone', 'Absent, destroyed, or not yours. Deliberately indistinguishable.') +
    row('409', 'stale_write', 'Your <code>baseRevision</code> lost a race. Carries <code>expected</code>, <code>actual</code> and the current entity.') +
    row('409', 'precondition_failed', 'An illegal transition, not a race. Carries <code>operation</code> and the entity.') +
    row('422', 'invalid_document', 'A document failed validation. Carries <code>path</code> and <code>reason</code>.') +
    row('429', 'rate_limited', 'Carries <code>retryAfter</code> in seconds and a <code>Retry-After</code> header.') +
    row('500', 'internal', 'Something broke. Quote the <code>requestId</code>.') +
    '</tbody></table>' +
    '<div class="note warn"><strong>Retry policy — this is a contract, not a suggestion.</strong> ' +
    'Retry <code>5xx</code> and network failures, five times with backoff. Everything else is <strong>terminal</strong>: ' +
    '400, 401, 403, 404, 409, 413, 422, 429 and 501 will return the same answer no matter how many times you ask. ' +
    'Several routes deliberately answer 4xx for permanent conditions that look like server problems — an unconfigured ' +
    'image store is a <code>400 detail:"storage"</code> rather than a 500, precisely so a client does not spend thirty ' +
    'seconds of backoff arriving at the same place.</div>' +

    '<h4>A few rules that apply to every route</h4>' +
    '<table><tbody>' +
    row('Origin', 'Every unsafe method (anything but GET, HEAD, OPTIONS) needs an <code>Origin</code> header that exactly matches an entry in <code>APP_ORIGINS</code>. Not a prefix match — exact string equality. <strong>Two routes are exempt</strong>, both mounted above the guard and for the same reason: <code>POST /api/shop/payments/webhook</code> and <code>POST /api/public/unsubscribe</code>. Neither reads a cookie, so neither has any ambient authority for CSRF to borrow — one is authenticated by an HMAC over the raw body, the other by a 256-bit HMAC in <code>?token=</code>.') +
    row('Content-Type', 'Routes that read a body require <code>application/json</code>. A wrong type is <code>400 detail:"content-type"</code>. Routes whose body is entirely optional skip this check and treat an empty body as <code>{}</code>. <code>POST /api/public/unsubscribe</code> is the exception that proves it: it reads no body at all and takes a plain form submission, because its caller is a mail client.') +
    row('Unknown keys', 'Every body and query schema is strict. An unrecognised key is a 400 naming it — a typo fails loudly rather than being silently ignored. <strong>One deliberate exception:</strong> the query of <code>GET</code>/<code>POST /api/public/unsubscribe</code>, because corporate link-protection gateways append tracking parameters to every link they rewrite and a refusal there is an unsubscribe outage.') +
    row('NUL bytes', 'A U+0000 anywhere in a string, path segment or query value is a 400, not a 500.') +
    row('__proto__', 'An own <code>__proto__</code> key anywhere in a body is rejected outright.') +
    '</tbody></table>';

  function row() {
    var c = Array.prototype.slice.call(arguments), h = '<tr>';
    for (var i = 0; i < c.length; i++) {
      var cls = (i === 0 && /^\d{3}$/.test(c[i])) ? ' class="st s' + c[i][0] + '"' : '';
      h += '<td' + cls + '>' + c[i] + '</td>';
    }
    return h + '</tr>';
  }

  var CONCEPTS = {
    shop:
      '<h2 id="c-start">Getting started</h2>' +
      '<p class="lede">A complete storefront purchase is six calls. Everything else is administration.</p>' +
      '<div class="codeblock"><pre><code>' + esc(
        'POST /api/shop/cart                  → a cart (or the one your cookie already names)\n' +
        'POST /api/shop/cart/lines            → add a variant\n' +
        'POST /api/shop/checkout/start        → reserve the stock\n' +
        'PUT  /api/shop/checkout/addresses    → sets the tax zone, returns shipping options\n' +
        'PUT  /api/shop/checkout/shipping     → pick one\n' +
        'POST /api/shop/checkout/freeze       → lock the totals\n' +
        'POST /api/shop/payments/intents      → send the customer to authorizationUrl\n' +
        'POST /api/shop/payments/intents/:id/confirm   → when they come back'
      ) + '</code></pre></div>' +
      '<div class="note"><strong>Send credentials.</strong> Carts, customer sessions and admin sessions are all ' +
      'cookie-based, and every cookie is <code>__Host-</code> prefixed, HttpOnly, Secure and SameSite=Lax. ' +
      'From a browser that means <code>fetch(url, { credentials: "include" })</code>; from curl it means ' +
      '<code>-c cookies.txt -b cookies.txt</code>. Without it every request looks like a brand new visitor.</div>' +

      '<h2 id="c-money">Money</h2>' +
      '<p class="desc"><strong>Every amount is an integer in the currency\'s minor unit.</strong> £19.99 is ' +
      '<code>1999</code>. There are no floats anywhere in this API, and sending <code>19.99</code> where an amount ' +
      'is expected is a 400 rather than a silent rounding.</p>' +
      '<p class="desc">Prices and cart figures come as a <code>Money</code> pair; order and payment totals are bare ' +
      'integers with a sibling <code>currency</code> field. Tax rates are basis points — <code>2000</code> is 20%. ' +
      'Rounding is half-up, applied per line and then summed, so a total always equals the sum of the lines you were shown.</p>' +
      '<div class="codeblock"><pre><code>' + esc(
        '{ "amount": 1999, "currency": "GBP" }     // Money — a price, a line total\n' +
        '{ "grandTotal": 5272, "currency": "GBP" } // an order — bare minor units\n' +
        '{ "rateBps": 2000 }                       // 20% VAT'
      ) + '</code></pre></div>' +
      '<p class="desc">The store is single-currency. A cart that somehow mixes currencies is refused at freeze time ' +
      'with a <code>currency_mismatch</code> 409 naming where each one came from, rather than being converted at a ' +
      'rate nobody chose.</p>' +

      '<h2 id="c-ident">The three identities</h2>' +
      '<p class="desc">Three separate cookies that never interfere with each other. Signing out of the storefront ' +
      'does not empty the basket, and it does not log an administrator out of the studio.</p>' +
      '<table><thead><tr><th>Cookie</th><th>Is</th><th>Obtained by</th></tr></thead><tbody>' +
      row('__Host-shop_cart', 'A cart id. Carries no identity at all.', '<code>POST /api/shop/cart</code>') +
      row('__Host-shop_session', 'A customer.', 'Magic link → <code>/customer/session/redeem</code>') +
      row('__Host-studio_session', 'A writer or the owner.', '<code>POST /api/auth/login</code>') +
      '</tbody></table>' +
      '<div class="note">An anonymous cart is <strong>merged</strong> into the customer\'s cart when they sign in — ' +
      'what happened is reported in <code>changes</code>, and the cart cookie is reissued if the id moved. ' +
      'A shopper who fills a basket and then signs in does not lose it.</div>' +

      '<h2 id="c-conflict">Conflicts and concurrency</h2>' +
      '<p class="desc">Cart and product writes accept an optional <code>baseRevision</code>. Send the revision you ' +
      'read, and a write that lost a race comes back as a <strong>409 carrying the current entity</strong> — so a ' +
      '"someone else changed this, load theirs" button needs no second request. Omit it and you are last-write-wins.</p>' +
      '<p class="desc">Two 409s, and they mean different things. <code>stale_write</code> is a race you can retry ' +
      'after rebasing. <code>precondition_failed</code> is an illegal operation — publishing an already-published ' +
      'product — and retrying will never help.</p>' +

      '<h2 id="c-limits">Rate limits</h2>' +
      '<p class="desc">Fixed windows in Postgres, so the limit bounds the deployment rather than one instance. ' +
      'Exceeding one is a 429 carrying <code>retryAfter</code> seconds and a <code>Retry-After</code> header.</p>' +
      '<table><thead><tr><th>Bucket</th><th>Limit</th><th>Applies to</th></tr></thead><tbody>' +
      row('shop-cart-new:&lt;ip&gt;', '20 / hour', 'Creating a cart. Not charged when an existing cart is handed back.') +
      row('shop-cart-write:&lt;cartId&gt;', '120 / 10 min', 'Adding, changing and removing lines.') +
      row('shop-checkout:&lt;cartId&gt;', '10 / 15 min', 'Starting checkout.') +
      row('shop-magic:&lt;ip&gt;', '20 / 15 min', '<strong>Requesting</strong> a magic link — <code>POST /api/shop/customer/session</code>. Charged after the body is parsed, because the second bucket below needs the address out of it.') +
      row('shop-magic:&lt;ip&gt;|&lt;email&gt;', '5 / 15 min', 'Magic links for one address. Without it, a per-IP limit alone lets one host walk an address list without ever crossing a threshold.') +
      row('shop-redeem:&lt;ip&gt;', '20 / 15 min', '<strong>Redeeming</strong> one — <code>POST /api/shop/customer/session/redeem</code>. A separate bucket from the request above, so a shopper who asked for two links can still spend the one that arrived.') +
      '</tbody></table>' +
      '<p class="desc">No other shop route is rate limited.</p>' +

      '<h2 id="c-errors">Errors</h2>' + COMMON_ERRORS,

    blog:
      '<h2 id="c-start">Getting started</h2>' +
      '<p class="lede">An invite-only, multi-writer publishing API. Accounts exist only by invitation from the owner; ' +
      'there is no public sign-up route, by design.</p>' +
      '<div class="codeblock"><pre><code>' + esc(
        'POST /api/auth/login              → sets __Host-studio_session\n' +
        'GET  /api/posts?status=draft      → list (no bodies)\n' +
        'POST /api/posts                   → create a draft\n' +
        'PATCH /api/posts/:id              → save, with baseRevision\n' +
        'POST /api/posts/:id/publish       → publish\n' +
        'GET  /api/posts/:id/revisions     → the history'
      ) + '</code></pre></div>' +
      '<div class="note"><strong>Send credentials.</strong> The session is a <code>__Host-studio_session</code> ' +
      'cookie — HttpOnly, Secure, SameSite=Lax. In a browser use <code>credentials: "include"</code>; ' +
      'with curl use <code>-c cookies.txt -b cookies.txt</code>.</div>' +

      '<h2 id="c-roles">Roles and permissions</h2>' +
      '<p class="desc">Two roles. The rules are enforced per post, not per route, so they are worth knowing exactly:</p>' +
      '<table><thead><tr><th>Action</th><th>Who</th></tr></thead><tbody>' +
      row('Read any post', 'Any authenticated user. Writers see each other\'s drafts.') +
      row('Edit a post', 'Its author, or the owner.') +
      row('Trash / restore / publish', 'Its author, or the owner.') +
      row('Destroy permanently', '<strong>Owner only.</strong> <code>DELETE /api/posts/:id</code> and <code>POST /api/trash/empty</code>.') +
      row('Invite, export, collect orphans', 'Owner only.') +
      row('Manage the team', '<strong>Owner only.</strong> <code>GET /api/users</code> and <code>POST /api/users/:id/disable</code> / <code>/enable</code> — the list is the email address of every person with a login, and revoking access belongs with invites.') +
      row('Delete a category', '<strong>Owner only.</strong> <code>DELETE /api/categories/:id</code> — the one category route a writer may not call, because it is the only one that rewrites <code>posts.category</code> in bulk, on posts the caller did not write, with no undo. Creating and renaming are open to writers.') +
      row('Everything under <code>/api/admin/email/*</code>', '<strong>Owner only, all seventeen routes.</strong> A writer publishing a bad post is a post that can be unpublished; a writer pressing &ldquo;send&rdquo; is thousands of messages that cannot be recalled, to a list whose consent the owner is answerable for.') +
      '</tbody></table>' +
      '<div class="note warn">A missing post is checked <em>before</em> authorization, so a 404 never leaks as a 403 — ' +
      'you cannot use permission errors to discover which ids exist.</div>' +
      '<div class="note"><strong>Role is not the only gate, and the two are not the same check.</strong> The rows above ' +
      'that name a route are enforced by <code>requireOwner()</code> middleware, which answers 403 before the handler ' +
      'runs. The per-post rows are enforced by <code>authorize()</code> <em>inside</em> the handler, after the post has ' +
      'been read — which is exactly why the 404-before-403 rule above holds. <code>DELETE /api/posts/:id</code> is ' +
      'owner-only by the second mechanism rather than the first, so a writer aiming it at an id that does not exist ' +
      'gets a 404, not a 403.</div>' +

      '<h2 id="c-cas">Saving, and not losing work</h2>' +
      '<p class="desc">Writes are <strong>compare-and-swap</strong>. Send the <code>baseRevision</code> you read; if ' +
      'someone else saved first, you get a <strong>409 carrying <code>expected</code>, <code>actual</code>, and the ' +
      'server\'s current post</strong> — enough to render both versions and offer a choice without a second request. ' +
      'A losing save writes nothing at all, <code>updated_at</code> included.</p>' +
      '<p class="desc">The revision log is append-only and independent. Every save writes a revision; ' +
      '<code>kind</code> distinguishes <code>autosave</code> from a deliberate <code>manual</code> checkpoint, and ' +
      'the server writes <code>publish</code> and <code>status</code> entries of its own so a status change is ' +
      'explained in the history rather than showing as an unexplained jump. <strong>Autosaves are pruned to the ' +
      'newest 30; manual, publish and status snapshots are never pruned.</strong></p>' +
      '<p class="desc">Restoring writes <em>forward</em> — the restored content becomes a new revision, so the ' +
      'version you restored away from is still there.</p>' +
      '<p class="desc">Lifecycle routes are the exception: they take no <code>baseRevision</code> and read no body. ' +
      'The server pins the post\'s lifecycle generation and retries, so a concurrent content edit does not block a ' +
      'publish — but a concurrent lifecycle change does, and you get a 409 rather than having your intent silently ' +
      're-applied over someone else\'s.</p>' +

      '<h2 id="c-page">Pagination</h2>' +
      '<p class="desc">Keyset, not offset — so a page never skips or repeats a row because something changed ' +
      'underneath you. Read <code>nextCursor</code> and pass it back; a null means you are at the end.</p>' +
      '<div class="note warn"><strong>A cursor is bound to the sort that minted it.</strong> Changing the sort ' +
      'dropdown mid-scroll and reusing the cursor is a <code>400 detail:"cursor"</code>, never a quietly wrong page. ' +
      'When the sort changes, start again with no cursor. The same applies across resources: a post-list cursor is ' +
      'rejected by the revisions list.</div>' +
      '<p class="desc"><code>limit</code> is 1–100 with a default of 24, and out-of-range values are ' +
      '<strong>rejected rather than clamped</strong>.</p>' +

      '<h2 id="c-doc">Document validation</h2>' +
      '<p class="desc">Post bodies are a TipTap/ProseMirror document. Validation is an <strong>allow-list</strong>: ' +
      'an unlisted node, mark, attribute or URL protocol is refused. A failure is a ' +
      '<code>422 invalid_document</code> naming the <code>path</code> and a <code>reason</code> of ' +
      '<code>too_large</code>, <code>too_deep</code>, <code>too_many_nodes</code>, <code>malformed</code>, ' +
      '<code>unknown_node</code>, <code>unknown_mark</code>, <code>bad_attrs</code> or <code>bad_protocol</code>.</p>' +
      '<table><thead><tr><th>Limit</th><th>Value</th></tr></thead><tbody>' +
      row('Document size (serialised JSON)', '2 MiB') +
      row('Nesting depth', '40') +
      row('Node count', '20 000') +
      row('Derived text (search index)', '500 000 bytes') +
      row('Title / subtitle', '2 000 bytes each') +
      row('Excerpt', '4 000 bytes') +
      row('Category / each tag', '400 bytes') +
      row('Tags per post', '64') +
      '</tbody></table>' +
      '<p class="desc"><strong>Nodes:</strong> <code>doc, text, paragraph, heading, blockquote, bulletList, ' +
      'orderedList, listItem, taskList, taskItem, codeBlock, horizontalRule, hardBreak, image, table, tableRow, ' +
      'tableHeader, tableCell</code>. <strong>Marks:</strong> <code>bold, italic, underline, strike, code, link</code>.</p>' +
      '<p class="desc"><strong>Link protocols:</strong> <code>http: https: mailto: ftp: ftps: tel: callto: sms: ' +
      'cid: xmpp:</code>, plus scheme-less relative hrefs like <code>#footnote</code> and <code>/about</code>. ' +
      '<strong>Image <code>src</code>:</strong> <code>https:</code> and <code>http:</code> only. Because it is an ' +
      'allow-list, <code>javascript:</code>, <code>data:</code> and <code>vbscript:</code> are absent by construction ' +
      'rather than by a blocklist someone has to keep current.</p>' +
      '<div class="note warn">A 422 is <strong>terminal</strong> — retrying will not help, and a client that keeps ' +
      'retrying is a client whose writer is typing into something that can never be saved. Surface it.</div>' +

      '<h2 id="c-img">Uploading images</h2>' +
      '<p class="desc">Three steps, and the server verifies rather than trusts:</p>' +
      '<div class="codeblock"><pre><code>' + esc(
        '1. POST /api/images                → { id, uploadUrl, headers }\n' +
        '2. PUT  <uploadUrl>                → the bytes, with those headers VERBATIM\n' +
        '3. POST /api/images/:id/commit     → the server sniffs and accepts, or deletes'
      ) + '</code></pre></div>' +
      '<p class="desc">Step 2\'s URL and headers are signature inputs. Change a header, add one, or reorder ' +
      'anything, and R2 rejects the upload.</p>' +
      '<p class="desc">At commit the server re-reads the object\'s real size, pulls the first 64 KiB and identifies ' +
      'the format from <strong>magic bytes</strong>. If that does not equal what you declared, both the row and the ' +
      'object are deleted. For JPEG it also enforces the EXIF strip — and an image whose EXIF state cannot be ' +
      'determined is rejected too, because "cannot tell" must not read as "accept" when the thing being checked is ' +
      'whether GPS coordinates are about to be published.</p>' +
      '<p class="desc">Limits per owner: <strong>12 MiB</strong> per image, <strong>10</strong> open uncommitted ' +
      'slots, <strong>1 GiB</strong> total. Allowed: JPEG, PNG, GIF, WebP, AVIF.</p>' +
      '<div class="note"><strong>Known gap, stated rather than hidden:</strong> the EXIF check is JPEG-only. ' +
      'A WebP or PNG carrying location metadata will commit and be served.</div>' +

      '<h2 id="c-public">Public reading — it lives on its own surface</h2>' +
      '<div class="note"><strong>The public reading API exists.</strong> It is a separate surface — see the ' +
      '<strong>Public</strong> tab at the top of this page — mounted under <code>/api/public/*</code>, needing no ' +
      'credential of any kind, and exposing published posts only. Everything on <em>this</em> (Blog) surface remains ' +
      'an authenticated admin API: every route here except <code>GET /api/health</code> and the five ' +
      'unauthenticated auth routes (<code>login</code>, <code>logout</code>, <code>accept-invite</code>, ' +
      '<code>forgot</code>, <code>reset</code>) carries <code>requireAuth()</code> or <code>requireOwner()</code>.</div>' +
      '<p class="desc">The two surfaces answer different questions and share no code path for visibility. This one ' +
      'shows an authenticated writer every author\'s posts in every state, with <code>authorId</code>, ' +
      '<code>revision</code>, <code>status</code> and <code>deletedAt</code>. The public one is built from an ' +
      'allow-list projection and one four-part SQL predicate, and cannot be persuaded to show anything else — there ' +
      'is no <code>status</code> query key on it to name.</p>' +
      '<table><thead><tr><th>Reading as an anonymous visitor</th><th>Where</th></tr></thead><tbody>' +
      row('List published posts', '<code>GET /api/public/posts</code> — keyset pagination, category/tag/full-text filters.') +
      row('One post by slug', '<code>GET /api/public/posts/:slug</code>, including the document body. An unpublished slug is the same 404 as an absent one.') +
      row('RSS and sitemap', '<code>GET /api/public/feed.xml</code> and <code>GET /api/public/sitemap.xml</code>.') +
      row('Category and tag vocabulary', '<code>GET /api/public/categories</code> and <code>GET /api/public/tags</code>, counted over published posts only.') +
      row('Images', '<code>GET /api/public/images/:id</code> — a 302 to a five-minute presigned URL. <strong>Two reference scopes, OR-ed:</strong> the live content or cover of a currently <em>published post</em>, or the cover or gallery of a currently <em>active product</em> (<code>status = \'active\' AND deleted_at IS NULL</code>). Neither counts history: an image cut from a published post, or a product that is unpublished, stops being public in the same moment. <code>GET /api/images/:id</code> on this surface still requires a session.') +
      '</tbody></table>' +
      '<p class="desc">Still true, and worth stating plainly:</p>' +
      '<table><thead><tr><th>Still the case</th><th>Detail</th></tr></thead><tbody>' +
      row('There is no public front-end reading <em>page</em>', 'The API is public; the client is not. The SPA\'s <code>/read/:id</code> route sits inside <code>AppShell</code>\'s auth guard and renders from local IndexedDB — a preview for logged-in writers, not a published page. Nothing in <code>src/</code> renders <code>/api/public/*</code>.') +
      row('The feed and sitemap link to a page nobody serves yet', 'Both build <code>&lt;origin&gt;/posts/&lt;slug&gt;</code> from the first <code>APP_ORIGINS</code> entry. That is the intended public permalink shape, and the SPA does not currently route it — a reading front end is what closes the loop.') +
      row('This surface is unchanged', 'No route on the Blog surface became public. The public API is additive and separately mounted, above the session middleware, so a handler there structurally cannot read a cookie.') +
      '</tbody></table>' +

      '<h2 id="c-limits">Rate limits</h2>' +
      '<p class="desc">Every bucket on this surface, and the route that charges it. <strong>Each credential route ' +
      'has its own key prefix</strong> — they are deliberately not pooled, so exhausting one does not lock a user ' +
      'out of a different flow. Exactly two buckets in the whole application are ever cleared by a success: ' +
      '<code>login:&lt;ip&gt;|&lt;email&gt;</code> and <code>chpw:&lt;userId&gt;</code>.</p>' +
      '<table><thead><tr><th>Bucket</th><th>Limit</th><th>Applies to</th></tr></thead><tbody>' +
      row('login:&lt;ip&gt;', '20 / 15 min', '<code>POST /api/auth/login</code>, per IP. <strong>Never cleared by a success</strong> — clearing it would hand anyone holding one valid account a reset button for the password-spray limiter.') +
      row('login:&lt;ip&gt;|&lt;email&gt;', '5 / 15 min', 'Login for one address. <strong>Forgotten on success</strong>, so four typos do not lock you out of your own account for a quarter of an hour after the fifth attempt finally works. The narrow bucket only — the per-IP one above survives.') +
      row('accept:&lt;ip&gt;', '20 / 15 min', '<code>POST /api/auth/accept-invite</code> — <strong>its own bucket, not login\'s.</strong> An invitee redeeming a link has no account yet, so charging login\'s key would let a busy sign-up hour lock out the writers already working.') +
      row('forgot:&lt;ip&gt;', '20 / 15 min', '<code>POST /api/auth/forgot</code>, per IP. <strong>Charged before the body is parsed</strong> — a limiter cannot bound work that runs after it.') +
      row('forgot:&lt;ip&gt;|&lt;email&gt;', '5 / 15 min', 'Reset mail for one address, and what stops one host mail-bombing one inbox. It cannot move above the parse: the address it keys on is in the body.') +
      row('reset:&lt;ip&gt;', '20 / 15 min', '<code>POST /api/auth/reset</code> — redeeming a reset token, per IP.') +
      row('chpw:&lt;userId&gt;', '5 / 15 min', '<code>POST /api/auth/change-password</code>, checked before the body is parsed. <strong>Keyed on the account, not the IP</strong>: the threat is somebody at an unlocked laptop guessing the existing password, so moving between networks must not reset the count. Forgotten on a successful change.') +
      row('export:&lt;userId&gt;', '5 / hour', 'Export.') +
      row('import:&lt;userId&gt;', '5 / hour', 'Import — <strong>charged before the body is parsed</strong>, so a malformed bundle still spends one.') +
      row('images:&lt;userId&gt;', '120 / hour', 'Reserving upload slots.') +
      row('images:commit:&lt;userId&gt;', '240 / hour', 'Committing uploads.') +
      row('emailimport:&lt;userId&gt;', '5 / hour', '<code>POST /api/admin/email/subscribers/import</code> — the same allowance as the backup import, for the same reason: a bulk write of attacker-shaped text through a parser.') +
      row('emailtest:&lt;userId&gt;', '10 / 15 min', '<code>POST /api/admin/email/broadcasts/:id/test</code>. A test send is a real message to a real inbox, and the owner\'s own inbox is still an inbox somebody has to read.') +
      '</tbody></table>' +
      '<div class="note">No other route on this surface is rate limited — not the post, revision, category, team or ' +
      'broadcast routes. The public unsubscribe endpoint has its own bucket on the ' +
      '<strong>Public</strong> surface.</div>' +

      '<h2 id="c-errors">Errors</h2>' + COMMON_ERRORS,

    public:
      '<h2 id="c-start">Getting started</h2>' +
      '<p class="lede">The reading API is seven routes, all <code>GET</code>, all anonymous. There is nothing to sign up for and nothing to send.</p>' +
      '<div class="codeblock"><pre><code>' + esc(
        'curl https://example.com/api/public/posts\n' +
        'curl https://example.com/api/public/posts/my-slug\n' +
        'curl https://example.com/api/public/feed.xml'
      ) + '</code></pre></div>' +
      '<div class="note"><strong>Send nothing.</strong> No cookie, no bearer token, no API key. The reading routes ' +
      'are mounted <em>above</em> the session middleware, so a handler there structurally cannot read a cookie — a ' +
      'response marked <code>Cache-Control: public</code> is therefore incapable of varying by who asked, even if a ' +
      'later edit tried. Sending a session cookie changes the response byte for byte: not at all.</div>' +
      '<div class="note warn"><strong>One more path shares the <code>/api/public/</code> prefix and is not part of ' +
      'the reading API.</strong> <code>GET</code> and <code>POST /api/public/unsubscribe?token=</code> is the ' +
      'one-click unsubscribe link carried by marketing email. It is a <em>different router</em>, mounted separately ' +
      'in <code>server/index.ts</code>: it answers <strong>HTML rather than JSON</strong> (the caller is a person in ' +
      'a mail client, not a program), it is <code>Cache-Control: no-store</code> and <code>X-Robots-Tag: noindex</code> ' +
      'because the page names an email address, and it sits <em>above</em> the origin guard so an RFC&nbsp;8058 ' +
      'one-click <code>POST</code> from a mail provider — which carries no <code>Origin</code> at all — is not a 403. ' +
      'Its whole authority is a 256-bit HMAC in <code>?token=</code>. The <code>GET</code> only asks; the ' +
      '<code>POST</code> is what unsubscribes, so a link scanner fetching every URL in a message cannot remove ' +
      'anybody. It is also the one route in this application whose query is <strong>not</strong> ' +
      '<code>.strict()</code> — corporate link-protection gateways append their own tracking parameters to every ' +
      'link they rewrite, and refusing those would turn one gateway into an unsubscribe outage for a whole ' +
      'company.</div>' +

      '<h2 id="c-visible">What is exposed, and what is not</h2>' +
      '<p class="desc"><strong>Published posts only.</strong> A post is visible on this surface when <em>all four</em> ' +
      'of these are true — one predicate, in one place in the SQL, applied to the list, the by-slug read, the feed, ' +
      'the sitemap, both taxonomy routes and the post half of the image check:</p>' +
      '<table><thead><tr><th>Must be true</th><th>Why it is a separate condition</th></tr></thead><tbody>' +
      row('Its status is <code>published</code>', 'Drafts and archived posts are not published.') +
      row('It is not in the trash', 'Trash is a <em>view</em>, not a status: a published post that was then trashed still reads <code>status = published</code>, so this has to be asked separately.') +
      row('It has a slug', 'A published post with no slug has no URL — it could be listed and never opened, so the list and the detail route would disagree about what exists.') +
      row('It has a published date', 'Being published does not imply having a date: a post created or imported with a null date would reach an RSS <code>pubDate</code> and a sitemap <code>lastmod</code> as <code>null</code>.') +
      '</tbody></table>' +
      '<div class="note warn"><strong>You cannot name a status.</strong> There is no <code>status</code> query key on ' +
      'any route and no way to spell one: <code>?status=draft</code> is a <code>400</code> naming the unknown key, ' +
      'not a filter that was ignored. Visibility is decided by the predicate above and never by the request.</div>' +
      '<p class="desc">The consequence runs further than the post list. The taxonomy routes count <strong>published ' +
      'posts only</strong>, because an unbounded <code>DISTINCT category</code> would publish the working vocabulary ' +
      'of every draft in the system — a pre-announcement signal. And an unpublished slug is answered with exactly ' +
      'the same <code>404</code> as a slug that never existed, from the same code path, so unpublished slugs cannot ' +
      'be enumerated by probing.</p>' +

      '<h2 id="c-shape">The projection — why fields are missing</h2>' +
      '<p class="desc">A public post is <strong>not</strong> the admin <code>Post</code> with some keys deleted. It ' +
      'is built field by field from an allow-list, deliberately, so that a field added to the admin model tomorrow ' +
      'does <em>not</em> appear here the moment it is added. Every field of <code>Post</code> is classified as public ' +
      'or private in one exhaustive table, and adding a field without classifying it is a compile error.</p>' +
      '<table><thead><tr><th>Absent field</th><th>Why</th></tr></thead><tbody>' +
      row('<code>authorId</code>', 'An internal identifier. The byline arrives instead, reshaped as <code>author: { name }</code> — never an id, never an email.') +
      row('<code>status</code>', 'Every row here is published, so it carries no information and its presence would invite filtering on it.') +
      row('<code>deletedAt</code>', 'Trash state is internal; nothing trashed is reachable here anyway.') +
      row('<code>revision</code>', 'The autosave counter. Published, it would let an anonymous poll report an author\'s in-progress editing in near real time.') +
      row('<code>excerptSource</code>', 'Whether the excerpt was written or derived is editorial process, not reading material.') +
      row('<code>createdAt</code>', 'When a draft was first typed into is not a public fact. <code>publishedAt</code> and <code>updatedAt</code> are.') +
      '</tbody></table>' +
      '<p class="desc"><code>content</code> is public on the detail route only — a list response ships no documents. ' +
      'And <code>sort=oldest</code> means <strong>oldest published</strong>, not oldest created: the private ' +
      '<code>createdAt</code> is not merely omitted from the body, it is kept out of the pagination cursor too, ' +
      'which is base64 of plain JSON and would otherwise have handed back a creation timestamp the projection had ' +
      'just refused to emit.</p>' +
      '<p class="desc"><code>sort</code> offers <code>published</code> (default), <code>oldest</code> and ' +
      '<code>alphabetical</code>. It does <strong>not</strong> offer <code>updated</code> — that exposes editing ' +
      'activity on published posts — nor <code>drafts-first</code>, which is meaningless when every row is published.</p>' +

      '<h2 id="c-img">Images and <code>asset:</code> references</h2>' +
      '<p class="desc">A post\'s <code>coverImage</code> arrives <strong>already resolved</strong> to a public URL. ' +
      'The document body does not: inline image sources inside <code>content</code> are left as stored, and the ' +
      'resolution rule is published instead of being baked into the bytes.</p>' +
      '<div class="codeblock"><pre><code>' + esc(
        'attrs.src = "asset:img_9fZ2"      →  GET /api/public/images/img_9fZ2\n' +
        'attrs.src = "idb:img_9fZ2"        →  GET /api/public/images/img_9fZ2\n' +
        'coverImage.url                    →  already /api/public/images/<id>'
      ) + '</code></pre></div>' +
      '<p class="desc">That route answers <strong>302</strong> to a presigned URL valid for five minutes — it never ' +
      'proxies bytes, which is why its own response is <code>private, no-store</code>: a cached redirect would ' +
      'outlive the credential inside it.</p>' +
      '<div class="note warn"><strong>Only live references are served, and there are now two of them.</strong> An ' +
      'image qualifies when it is referenced by the <em>current</em> content or cover of a <em>currently ' +
      'published</em> post, <strong>or</strong> by the cover or gallery of a <em>currently active</em> product ' +
      '(<code>status = \'active\' AND deleted_at IS NULL</code>) — the same predicate the storefront product routes ' +
      'apply, so an image is servable exactly when the page that would show it is reachable. A reference from a ' +
      'revision does not count, so an image cut from a published post stops being public the moment the cut is ' +
      'saved. Neither does a draft, an archived or a trashed post; nor a draft, archived or trashed product; nor an ' +
      'upload slot whose bytes were never committed. Unknown, uncommitted and unreferenced are one <code>404</code> ' +
      'from one statement.<br><br>This is the deliberate mirror image of the orphan collector, which counts post ' +
      'revisions <em>and</em> products in <strong>every</strong> state so it never deletes bytes somebody needs. ' +
      'This check fails the other way: it would rather refuse a byte somebody wanted than publish a private one.</div>' +

      '<h2 id="c-cache">Caching and conditional requests</h2>' +
      '<p class="desc">Every JSON and XML route carries an <code>ETag</code>. It is <strong>opaque</strong> — a hash ' +
      'over the exact bytes being sent, not the revision and not any internal counter — so it changes when, and only ' +
      'when, the public view changes, and it tells you nothing else. <code>Last-Modified</code> is the newest ' +
      '<code>updatedAt</code> in the answer, and is <strong>omitted rather than invented</strong> when there is no ' +
      'row to name (an empty page, or the taxonomy aggregates).</p>' +
      '<table><thead><tr><th>Route</th><th>Cache-Control</th></tr></thead><tbody>' +
      row('<code>GET /api/public/posts</code>', '<code>public, s-maxage=60, stale-while-revalidate=300</code>') +
      row('… with a non-empty <code>search</code>', '<code>public, s-maxage=10</code> — a full-text query is unbounded in cardinality and would otherwise fill the edge with one entry per phrase anyone ever typed') +
      row('<code>GET /api/public/posts/:slug</code>', '<code>public, s-maxage=300, stale-while-revalidate=3600</code>') +
      row('… its <code>404</code>', '<code>public, s-maxage=30</code> — a positive TTL on a miss, on purpose: detail reads carry no limiter, so unknown-slug probing would otherwise reach the database every time') +
      row('<code>GET /api/public/categories</code>, <code>/tags</code>', '<code>public, s-maxage=60, stale-while-revalidate=300</code>, <code>ETag</code> only — no <code>Last-Modified</code>') +
      row('<code>GET /api/public/feed.xml</code>, <code>/sitemap.xml</code>', '<code>public, s-maxage=600</code>') +
      row('<code>GET /api/public/images/:id</code>', '<code>private, no-store</code> — the redirect embeds a five-minute credential') +
      row('<code>GET</code>/<code>POST /api/public/unsubscribe</code>', '<code>no-store</code>, plus <code>X-Robots-Tag: noindex, nofollow</code> — the page names an email address, and this is the one prefix a shared cache has been told it MAY store. No <code>ETag</code>: it answers HTML, not JSON.') +
      '</tbody></table>' +
      '<h4>A worked revalidation</h4>' +
      '<div class="codeblock"><pre><code>' + esc(
        '$ curl -i https://example.com/api/public/posts\n' +
        'HTTP/1.1 200 OK\n' +
        'Cache-Control: public, s-maxage=60, stale-while-revalidate=300\n' +
        'ETag: "5f2c1ab90d7e4c3b8a61f0d2e7c94b15"\n' +
        'Last-Modified: Tue, 12 Aug 2026 09:14:27 GMT\n' +
        'Access-Control-Allow-Origin: *\n' +
        'Access-Control-Expose-Headers: ETag, Last-Modified, Retry-After\n' +
        '\n' +
        '$ curl -i https://example.com/api/public/posts \\\n' +
        '    -H \'If-None-Match: W/"5f2c1ab90d7e4c3b8a61f0d2e7c94b15"\'\n' +
        'HTTP/1.1 304 Not Modified\n' +
        'Cache-Control: public, s-maxage=60, stale-while-revalidate=300\n' +
        'ETag: "5f2c1ab90d7e4c3b8a61f0d2e7c94b15"\n' +
        '(no body)'
      ) + '</code></pre></div>' +
      '<p class="desc">Four things that follow, and all four are ordinary traffic rather than edge cases:</p>' +
      '<table><tbody>' +
      row('<code>W/</code> is accepted', 'Any intermediary may add a weak prefix. It is stripped before comparison, so the tag you were given still matches.') +
      row('Comma lists and <code>*</code>', '<code>If-None-Match</code> may carry several candidates, or the literal <code>*</code>, which always matches. Both are handled per RFC 9110 rather than by string equality.') +
      row('<code>If-Modified-Since</code> is honoured', 'On the list, the detail, the feed and the sitemap — the header crawlers and feed readers actually revalidate with. It is compared truncated to whole seconds on both sides, so echoing back the <code>Last-Modified</code> you were given is a 304 and not a spurious 200. An unparseable date is <strong>ignored</strong>, not an error.') +
      row('<code>If-None-Match</code> wins', 'When both headers are present the entity tag decides and the date is ignored entirely — not AND-ed, not OR-ed. A stale tag with a fresh date gets the bytes.') +
      '</tbody></table>' +
      '<p class="desc">A <code>304</code> carries the same validators, the same <code>Cache-Control</code> and the ' +
      'same CORS headers as the <code>200</code> would have — a revalidating client is told the same caching story ' +
      'as one that got the body.</p>' +

      '<h2 id="c-cors">CORS</h2>' +
      '<p class="desc">Every response from the <strong>reading</strong> router — success, <code>304</code>, and <em>every ' +
      'error</em>, including the 400s and the 429 — carries <code>Access-Control-Allow-Origin: *</code>. Errors are ' +
      'included deliberately: a browser client seeing an opaque CORS failure instead of a readable 404 is a worse ' +
      'outcome than the error itself.</p>' +
      '<div class="note warn"><strong>The unsubscribe pair carries no CORS header at all</strong>, and sharing the ' +
      '<code>/api/public/</code> prefix does not change that: it is a different router, mounted above this one, and the ' +
      'header is set by a middleware that lives inside the reading router. That is correct rather than an oversight — ' +
      'those two routes answer HTML to a person in a mail client, not JSON to cross-origin JavaScript, and there is ' +
      'nothing a browser script should be able to read from them.</div>' +
      '<table><tbody>' +
      row('<code>Access-Control-Allow-Origin: *</code>', 'Any origin. The seven reading routes and their preflight only — the authenticated API carries no such header, and neither does <code>/api/public/unsubscribe</code>.') +
      row('<code>Access-Control-Allow-Credentials</code>', '<strong>Never sent.</strong> With <code>*</code> it would be invalid anyway, and the combination is exactly what turns a public read API into a session-riding one. The header a browser needs in order to attach a cookie is never granted.') +
      row('<code>Access-Control-Expose-Headers: ETag, Last-Modified, Retry-After</code>', 'Without this, cross-origin JavaScript receives the validators and cannot read them — neither <code>ETag</code> nor <code>Last-Modified</code> is on the CORS safelist — so it could never send them back. curl, CDNs and feed readers were never affected; browsers were.') +
      row('<code>OPTIONS</code> preflight', 'Answered with <code>204</code>: <code>Allow-Methods: GET, HEAD, OPTIONS</code>, <code>Allow-Headers: If-None-Match, If-Modified-Since</code>, <code>Max-Age: 86400</code>. Sending a conditional header is not a simple request, so without this the preflight would 404 and the real request would never follow. It answers for the whole <code>/api/public/*</code> prefix, so <code>POST</code> is not advertised even on the unsubscribe path — which costs nothing, because a one-click unsubscribe is a server-to-server POST and a form submission is never preflighted.') +
      '</tbody></table>' +

      '<h2 id="c-limits">Rate limits</h2>' +
      '<p class="desc"><strong>Two buckets, and the reading one is on two things only.</strong> The limiter writes a ' +
      'database row per call, so putting it on the cheap, edge-cacheable routes would make them the expensive ones. ' +
      'Plain list, detail, feed, sitemap and both taxonomies carry <strong>no limiter at all</strong> and are ' +
      'protected by <code>s-maxage</code> at the edge instead.</p>' +
      '<table><thead><tr><th>Bucket</th><th>Limit</th><th>Applies to</th></tr></thead><tbody>' +
      row('public:&lt;ip&gt;', '300 / minute', 'A list request carrying a non-empty <code>search</code> (a full-text query the published partial index does not serve), and every request to <code>GET /api/public/images/:id</code>. Both are charged <em>before</em> the expensive work runs.') +
      row('unsub:&lt;ip&gt;', '120 / 15 min', '<code>GET</code> and <code>POST /api/public/unsubscribe</code>, sharing one bucket. <strong>Deliberately generous.</strong> An unsubscribe link is clicked by somebody who has just decided they are done with this sender, and a <code>429</code> at that moment is the worst possible answer; the limit exists only so an unauthenticated endpoint cannot be driven in a loop, and an office behind one NAT unsubscribing en masse must stay comfortably under it.') +
      '</tbody></table>' +
      '<div class="note">A <code>429</code> here carries <code>retryAfter</code> in the body and a ' +
      '<code>Retry-After</code> header, and — unlike most APIs — the CORS headers too, so a browser can actually ' +
      'read it. The bucket is keyed on the client IP as reported by the edge, so it is only as trustworthy as ' +
      'whatever sits in front of the function.</div>' +

      '<h2 id="c-errors">Errors</h2>' +
      '<div class="note">This surface never answers <code>401</code>, <code>403</code>, <code>409</code> or ' +
      '<code>422</code> — there is no credential to be missing, nothing to rebase against and no document to ' +
      'validate. In practice you will see <code>400</code>, <code>404</code>, <code>429</code> and, if something ' +
      'breaks, <code>500</code>. Note that an unconfigured image store and an unconfigured origin allow-list are ' +
      'both <code>400</code>s rather than 500s, precisely so a client does not spend thirty seconds of backoff ' +
      'arriving at the same place. The envelope below describes the reading routes; ' +
      '<code>/api/public/unsubscribe</code> answers <strong>HTML pages</strong> instead — <code>200</code> for ' +
      'ask-or-done and <code>404</code> for a link it cannot recognise, with the four reasons a link is ' +
      'unrecognisable deliberately not told apart.</div>' + COMMON_ERRORS
  };

  /* ── rendering ──────────────────────────────────────────── */

  var state = { surface: 'shop', q: '' };

  function chipsFor(r) {
    var a = AUTH[r.auth];
    return '<span class="m-chip ' + r.m + '">' + r.m + '</span>' +
           '<span class="path">' + esc(r.p) + '</span>' +
           '<span class="sum">' + r.sum + '</span>' +
           '<span class="auth ' + r.auth + '" title="' + a[1].replace(/<[^>]+>/g, '') + '">' + a[0] + '</span>';
  }

  function renderRoute(r) {
    var h = '<details class="route" id="' + routeId(r) + '"><summary>' + chipsFor(r) + '</summary><div class="body">';

    h += '<p class="desc"><strong>Authorization —</strong> ' + AUTH[r.auth][1] + '</p>';
    if (r.desc) h += '<p class="desc">' + r.desc + '</p>';

    if (r.alt) {
      h += '<h4>Also available at</h4><div class="codeblock"><pre><code>' +
           r.alt.map(function (p) { return esc(r.m + ' ' + p); }).join('\n') +
           '</code></pre></div>';
    }
    if (r.params) {
      h += '<h4>Path parameters</h4><table><tbody>';
      r.params.forEach(function (p) { h += row(esc(p[0]), p[1]); });
      h += '</tbody></table>';
    }
    if (r.query) {
      h += '<h4>Query parameters</h4><table><tbody>';
      r.query.forEach(function (p) { h += row(esc(p[0]), p[1] || '—'); });
      h += '</tbody></table>';
    }
    if (r.headers) {
      h += '<h4>Headers</h4><table><tbody>';
      r.headers.forEach(function (x) { h += row(x, ''); });
      h += '</tbody></table>';
    }
    if (r.body === null) {
      h += '<h4>Request body</h4><p class="desc">None — this route reads no body.</p>';
    } else if (r.body) {
      h += '<h4>Request body</h4>';
      /* Not every body is a JSON sketch — the webhook's is a sentence about
         raw bytes, and setting that in a code block reads as if it were a
         literal payload. */
      h += /^\s*[{[]/.test(r.body)
        ? '<div class="codeblock"><pre><code>' + esc(r.body) + '</code></pre></div>'
        : '<p class="desc">' + esc(r.body) + '</p>';
    }
    if (r.sets) {
      h += '<h4>Sets cookies</h4><table><tbody>';
      r.sets.forEach(function (x) { h += row(x, ''); });
      h += '</tbody></table>';
    }
    if (r.res) {
      h += '<h4>Success</h4>';
      Object.keys(r.res).forEach(function (code) {
        var v = r.res[code];
        /* `<?xml` too: the public feed and sitemap return documents, not JSON,
           and a raw XML sketch dropped into the prose branch would be parsed as
           markup rather than shown. */
        h += '<p class="desc"><span class="st s' + code[0] + '">' + code + '</span>' +
             (/^[{[]|^Location|^<\?xml/.test(v.trim()) ? '' : ' — ' + v) + '</p>';
        if (/^[{[]|^Location|^<\?xml/.test(v.trim())) {
          h += '<div class="codeblock"><pre><code>' + esc(v) + '</code></pre></div>';
        }
      });
    }
    if (r.cartView) {
      h += '<h4>The cart view</h4><p class="desc">Every cart route returns this same shape, so a client never ' +
           'needs a follow-up read after a mutation.</p>' +
           '<div class="codeblock"><pre><code>' + esc(CART_VIEW) + '</code></pre></div>';
    }
    if (r.rl) h += '<h4>Rate limit</h4><p class="desc">' + r.rl + '</p>';
    if (r.errs && r.errs.length) {
      h += '<h4>Errors</h4><table><thead><tr><th>Status</th><th>error</th><th>When</th></tr></thead><tbody>';
      r.errs.forEach(function (e) { h += row(String(e[0]), '<code>' + e[1] + '</code>', e[2] || '—'); });
      h += '</tbody></table>';
    }
    if (r.notes) r.notes.forEach(function (n) { h += '<div class="note">' + n + '</div>'; });

    /* No console for the webhook: its authority is an HMAC over the raw body,
       which this page cannot produce, so every attempt would be a 401 that
       tells the reader nothing about the route. */
    h += r.auth === 'webhook'
      ? '<div class="note">Not callable from this page — the request must be signed by the ' +
        'payment provider, and an unsigned attempt is always a <code>401 invalid_signature</code>. ' +
        'Use the provider dashboard\'s test-event tool to exercise it.</div>'
      : renderTry(r);
    h += '<p class="src">Source · ' + esc(r.src) + '</p>';
    return h + '</div></details>';
  }

  function renderTry(r) {
    var h = '<div class="try" data-m="' + r.m + '" data-p="' + esc(r.p) + '">' +
            '<div class="try-head"><strong>Try it</strong></div>';
    if (r.params) {
      r.params.forEach(function (p) {
        h += '<div class="try-row"><label>:' + esc(p[0]) + '</label>' +
             '<input data-param="' + esc(p[0]) + '" placeholder="value"></div>';
      });
    }
    if (r.query) {
      r.query.forEach(function (p) {
        h += '<div class="try-row"><label>?' + esc(p[0]) + '</label>' +
             '<input data-query="' + esc(p[0]) + '" placeholder="optional"></div>';
      });
    }
    if (r.body) {
      h += '<div class="try-row"><textarea data-body placeholder="JSON request body">' +
           esc(sampleFrom(r.body)) + '</textarea></div>';
    }
    h += '<div class="try-row" style="margin-top:8px">' +
         '<button class="btn pri" data-send>Send request</button>' +
         '<button class="btn" data-curl>Copy as curl</button></div>' +
         '<div class="out"><div class="out-status"></div>' +
         '<div class="codeblock"><pre><code></code></pre></div></div></div>';
    return h;
  }

  /* Turn a documented body sketch into a payload that actually parses.
     The sketches carry things JSON does not have — trailing `// comments`,
     union annotations (`"…" | null`), and `…` standing in for elided content.
     A prefilled body that 400s on `detail:"body"` teaches the reader nothing
     about the route, so each of those is resolved to the first alternative. */
  function sampleFrom(sketch) {
    var s = sketch.split('\n')
      .map(function (line) { return line.replace(/\s*\/\/.*$/, ''); })
      .filter(function (l) { return l.trim() !== ''; })
      .join('\n');

    /* collapse elisions before unions, so `{ … } | null` becomes `{}` */
    s = s.replace(/\{[^{}]*…[^{}]*\}/g, '{}')
         .replace(/\[[^\[\]]*…[^\[\]]*\]/g, '[]');

    /* a union documents the alternatives; the sample takes the first */
    var prev;
    do {
      prev = s;
      s = s.replace(/\s*\|\s*(null|true|false|\d+|"[^"]*"|\{\}|\[\])/g, '');
    } while (s !== prev);

    s = s.replace(/"…"/g, '""').replace(/…/g, '');

    /* If anything above missed a case, say so rather than handing over a body
       that fails for reasons the reader will blame on the API. */
    try { JSON.parse(s); return s; }
    catch (_) { return sketch; }
  }

  function render() {
    var surf = window.API_SURFACES.filter(function (s) { return s.id === state.surface; })[0];
    var q = state.q.trim().toLowerCase();
    var all = window.API_ROUTES.filter(function (r) { return r.surface === state.surface; });
    var shown = q ? all.filter(function (r) {
      return (r.p + ' ' + r.m + ' ' + r.sum + ' ' + r.group + ' ' + (r.desc || '')).toLowerCase().indexOf(q) > -1;
    }) : all;

    /* sidebar */
    var nav = '', lastG = null;
    if (!q) {
      nav += '<h3>Guide</h3>';
      var guide;
      if (state.surface === 'shop') {
        guide = [['c-start', 'Getting started'], ['c-money', 'Money'], ['c-ident', 'The three identities'],
                 ['c-conflict', 'Conflicts'], ['c-limits', 'Rate limits'], ['c-errors', 'Errors']];
      } else if (state.surface === 'public') {
        guide = [['c-start', 'Getting started'], ['c-visible', 'What is exposed'],
                 ['c-shape', 'The projection'], ['c-img', 'Images & asset:'],
                 ['c-cache', 'Caching'], ['c-cors', 'CORS'],
                 ['c-limits', 'Rate limits'], ['c-errors', 'Errors']];
      } else {
        guide = [['c-start', 'Getting started'], ['c-roles', 'Roles'], ['c-cas', 'Saving work'],
                 ['c-page', 'Pagination'], ['c-doc', 'Document validation'], ['c-img', 'Images'],
                 ['c-public', 'Public reading'], ['c-limits', 'Rate limits'], ['c-errors', 'Errors']];
      }
      guide.forEach(function (g) {
        nav += '<a href="#' + g[0] + '"><span class="np" style="font-family:var(--sans);font-size:13px">' +
               g[1] + '</span></a>';
      });
    }
    shown.forEach(function (r) {
      if (r.group !== lastG) { nav += '<h3>' + esc(r.group) + '</h3>'; lastG = r.group; }
      nav += '<a href="#' + routeId(r) + '" data-jump="' + routeId(r) + '">' +
             '<span class="vb ' + r.m + '">' + r.m + '</span>' +
             '<span class="np">' + esc(r.p.replace(/^\/api(\/shop)?/, '')) + '</span></a>';
    });
    $('#nav').innerHTML = nav;

    /* main */
    var out = '';
    if (!q) {
      out += '<h2 style="margin-top:0">' + surf.name + '</h2>' +
             '<p class="lede">' + surf.blurb + '</p>' +
             '<div class="note">' + surf.baseNote + '</div>' +
             CONCEPTS[state.surface] +
             '<h2 id="reference">Reference</h2>' +
             '<p class="lede">' + all.length + ' routes. Click any one to expand it, or use the filter box.</p>';
    } else {
      out += '<h2 style="margin-top:0">' + shown.length + ' of ' + all.length + ' routes</h2>' +
             '<p class="lede">Matching &ldquo;' + esc(state.q) + '&rdquo;.</p>';
    }

    if (!shown.length) {
      out += '<p class="empty">Nothing matches that.</p>';
    } else {
      lastG = null;
      shown.forEach(function (r) {
        if (r.group !== lastG) {
          out += '<h3 class="grp" id="g-' + r.group.toLowerCase().replace(/[^a-z]+/g, '-') + '">' +
                 esc(r.group) + '</h3>';
          lastG = r.group;
        }
        out += renderRoute(r);
      });
    }
    $('#content').innerHTML = out;
    if (q) {
      Array.prototype.forEach.call(document.querySelectorAll('.route'), function (d) { d.open = true; });
    }
  }

  /* ── surface switch ─────────────────────────────────────── */
  $('#switch').innerHTML = window.API_SURFACES.map(function (s) {
    return '<button data-surface="' + s.id + '" aria-pressed="' + (s.id === state.surface) + '" ' +
           'title="' + s.tagline + '">' + s.name.replace(' API', '') + '</button>';
  }).join('');

  $('#switch').addEventListener('click', function (e) {
    var b = e.target.closest('[data-surface]');
    if (!b) return;
    state.surface = b.dataset.surface;
    Array.prototype.forEach.call(this.children, function (c) {
      c.setAttribute('aria-pressed', String(c.dataset.surface === state.surface));
    });
    render();
    window.scrollTo(0, 0);
  });

  $('#search').addEventListener('input', function () { state.q = this.value; render(); });

  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' &&
        document.activeElement.tagName !== 'TEXTAREA') {
      e.preventDefault(); $('#search').focus();
    }
    if (e.key === 'Escape' && document.activeElement === $('#search')) {
      $('#search').value = ''; state.q = ''; render();
    }
  });

  /* nav highlight + expand on jump */
  document.addEventListener('click', function (e) {
    var j = e.target.closest('[data-jump]');
    if (!j) return;
    var d = document.getElementById(j.dataset.jump);
    if (d) d.open = true;
    Array.prototype.forEach.call(document.querySelectorAll('nav a'), function (a) {
      a.classList.toggle('active', a === j);
    });
  });

  /* ── theme ──────────────────────────────────────────────── */
  $('#theme').addEventListener('click', function () {
    var dark = document.documentElement.dataset.theme === 'dark';
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    this.textContent = dark ? 'Dark theme' : 'Light theme';
  });
  if (window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.dataset.theme = 'light';
    $('#theme').textContent = 'Dark theme';
  }

  /* ── try-it console ─────────────────────────────────────── */

  function buildRequest(box) {
    var path = box.dataset.p;
    Array.prototype.forEach.call(box.querySelectorAll('[data-param]'), function (i) {
      if (i.value.trim()) path = path.replace(':' + i.dataset.param, encodeURIComponent(i.value.trim()));
    });
    var qs = [];
    Array.prototype.forEach.call(box.querySelectorAll('[data-query]'), function (i) {
      if (i.value.trim()) qs.push(encodeURIComponent(i.dataset.query) + '=' + encodeURIComponent(i.value.trim()));
    });
    var base = $('#baseurl').value.replace(/\/+$/, '');
    var bodyEl = box.querySelector('[data-body]');
    return {
      method: box.dataset.m,
      url: base + path + (qs.length ? '?' + qs.join('&') : ''),
      body: bodyEl && bodyEl.value.trim() ? bodyEl.value : null
    };
  }

  document.addEventListener('click', function (e) {
    var box, req;

    if (e.target.matches('[data-curl]')) {
      box = e.target.closest('.try');
      req = buildRequest(box);
      var curl = "curl -X " + req.method + " '" + req.url + "'" +
        " \\\n  -b cookies.txt -c cookies.txt" +
        " \\\n  -H 'Origin: " + $('#baseurl').value.replace(/\/+$/, '') + "'";
      if (req.body) {
        curl += " \\\n  -H 'Content-Type: application/json'" +
                " \\\n  -d '" + req.body.replace(/\n\s*/g, ' ').replace(/'/g, "'\\''") + "'";
      }
      navigator.clipboard.writeText(curl).then(function () {
        var b = e.target, t = b.textContent;
        b.textContent = 'Copied';
        setTimeout(function () { b.textContent = t; }, 1400);
      });
      return;
    }

    if (!e.target.matches('[data-send]')) return;
    box = e.target.closest('.try');
    req = buildRequest(box);
    var out = box.querySelector('.out');
    var st = box.querySelector('.out-status');
    var pre = box.querySelector('.out code');
    out.classList.add('show');
    st.textContent = 'Sending…'; st.className = 'out-status'; pre.textContent = '';

    var init = { method: req.method, credentials: 'include', headers: {} };
    if (req.body) {
      init.headers['content-type'] = 'application/json';
      init.body = req.body;
    }

    fetch(req.url, init).then(function (res) {
      return res.text().then(function (text) {
        var cls = 'out-status st s' + String(res.status)[0];
        st.className = cls;
        st.textContent = res.status + ' ' + res.statusText +
          (res.headers.get('x-request-id') ? '   ·   requestId ' + res.headers.get('x-request-id') : '');
        try { pre.textContent = JSON.stringify(JSON.parse(text), null, 2); }
        catch (_) { pre.textContent = text || '(empty body)'; }
      });
    }).catch(function (err) {
      st.className = 'out-status st s5';
      st.textContent = 'Request failed';
      var base = $('#baseurl').value.trim();
      pre.textContent = err.message +
        '\n\nThis is a network-level failure, not an API response.' +
        (base
          ? '\n\nMost likely CORS. The API sets no Access-Control-Allow-Origin header, so a' +
            '\ncross-origin call from this page is blocked by the browser before it is sent.' +
            '\nClear the Base URL box to call this page\'s own origin instead — in dev, Vite' +
            '\nproxies /api to the API on port 8787, which makes the call same-origin.'
          : '\n\nThe API is not answering on this origin. In dev, start it with `npm run dev:api`' +
            '\n(the Vite server proxies /api to port 8787).') +
        '\n\nIf you opened this file over file://, serve the docs directory over http instead.';
    });
  });

  render();

  /* deep link on load */
  if (location.hash) {
    var target = document.getElementById(location.hash.slice(1));
    if (!target) {
      /* the route may live on the other surface — switch and retry */
      var other = window.API_ROUTES.filter(function (r) { return routeId(r) === location.hash.slice(1); })[0];
      if (other) {
        state.surface = other.surface;
        Array.prototype.forEach.call($('#switch').children, function (c) {
          c.setAttribute('aria-pressed', String(c.dataset.surface === state.surface));
        });
        render();
        target = document.getElementById(location.hash.slice(1));
      }
    }
    if (target) { target.open = true; target.scrollIntoView(); }
  }
})();
</script>
</body>
</html>
