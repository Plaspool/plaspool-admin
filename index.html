<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />

    <!--
      ===================== BRAND — keep in sync with src/brand.ts =====================
      This block duplicates values from `src/brand.ts`, and it has to: a social
      crawler fetches this HTML and never runs the app, so the tags below are the
      only ones it will ever see. `src/brand.test.tsx` compares the two and fails
      if they drift, which is what stops that duplication from rotting.

      Per-POST share cards (a card that shows the article's own title and cover)
      cannot be done here at all — one static file cannot describe every post.
      That needs server-rendered meta and is written up in ARCHITECTURE.md
      § TODO — future backend.
      ==================================================================================
    -->
    <title>PlaSpool — Ecommerce platform</title>
    <meta
      name="description"
      content="Everything the shop needs in one place: products and orders, rewards, returns and campaigns, and the blog that brings people to them."
    />
    <link rel="icon" href="/brand/icon.png" />
    <link rel="apple-touch-icon" href="/brand/icon.png" />
    <!-- Tints the browser chrome on mobile. Brand accent, one per theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#231c50" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14140f" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PlaSpool" />
    <meta property="og:title" content="PlaSpool — Ecommerce platform" />
    <meta
      property="og:description"
      content="Everything the shop needs in one place: products and orders, rewards, returns and campaigns, and the blog that brings people to them."
    />
    <meta property="og:url" content="https://blog-admin-app-gold.vercel.app" />
    <meta
      property="og:image"
      content="https://blog-admin-app-gold.vercel.app/brand/icon.png"
    />
    <meta name="twitter:card" content="summary" />
    <!-- ==================== end BRAND ==================== -->
  </head>
  <body>
    <div id="root"></div>
    <!-- ADMIN UI VERSION SWITCH — this line is the whole revert.
           v2 (current):  /src/v2/main.tsx
           v1 (previous): /src/main.tsx
         Nothing under src/ outside src/v2/ was changed to make v2 work, so
         swapping the src back restores v1 exactly. -->
    <script type="module" src="/src/v2/main.tsx"></script>
  </body>
</html>
